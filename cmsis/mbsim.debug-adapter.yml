# Debug adapter entry for the CMSIS-Toolbox / CMSIS Solution catalog (debug-adapters.yml).
# Installed by "mbsim register-cmsis-adapter"; select it in a csolution with
#   debugger:
#     name: mbsim
debug-adapters:
  - name: "mbsim"
    alias-name: ["microbit-v2-sim"]
    template: mbsim.adapter.json
    defaults:
      gdbserver:
        active:
        port: 3333
      telnet:
        port: 4444
    user-interface:
      - section: Simulation
        description: BBC micro:bit V2 simulator
        options:
          - name: Speed
            description: Simulation speed factor (1 = real time) or max
            yml-node: speed
            type: string
            default: "1"
          - name: Headless
            description: Run without the board window
            yml-node: headless
            type: enum
            values:
              - name: "No"
                value: false
                description: Show the board window
              - name: "Yes"
                value: true
                description: No window; the UART goes to the terminal
            default: false
      - section: Telnet
        description: Target UART on a TCP port (VS Code Serial Monitor, TCP mode)
        yml-node: telnet
        select: on
        options:
          - name: Port
            description: TCP port of the UART
            yml-node: port
            type: number
            default: 4444
